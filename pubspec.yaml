name: santo_ui
description: Enterprise-grade Flutter UI library with 60+ production-ready widgets and a built-in theming system.
version: 2.0.0
repository: https://github.com/BingKui/santo_ui
homepage: https://github.com/BingKui/santo_ui
issue_tracker: https://github.com/BingKui/santo_ui/issues
documentation: https://github.com/BingKui/santo_ui#readme

environment:
  sdk: ^3.13.3
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  xml: ">=6.1.0 <8.0.0"
  lpinyin: ^2.0.3
  path_drawing: ^1.0.0
  intl: ">=0.18.0 <2.0.0"
  photo_view: ^0.15.0
  bindings_compatible: ^1.0.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  analyzer: ^14.4.0

flutter:
  assets:
    - assets/appraise/
    - assets/share/
    - assets/icons/
    - assets/iconoir/regular/
    - assets/iconoir/solid/
    - assets/empty/
    - assets/json/
  fonts:
    - family: Bebas
      fonts:
        - asset: assets/fonts/Bebas-Regular.ttf
