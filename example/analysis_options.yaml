include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # 组件库移植自 Bruno,历史代码风格与严格 lint 存在差异,info 级风格提示降级为 ignore;
    # error/warning 级别保持生效。
    unnecessary_this: ignore
    prefer_initializing_formals: ignore
    use_super_parameters: ignore
    use_key_in_widget_constructors: ignore
    prefer_const_constructors_in_immutables: ignore
    library_private_types_in_public_api: ignore
    strict_top_level_inference: ignore
    no_leading_underscores_for_local_identifiers: ignore
    avoid_function_literals_in_foreach_calls: ignore
    sort_child_properties_last: ignore
    prefer_final_fields: ignore
    unnecessary_new: ignore
    sized_box_for_whitespace: ignore
    avoid_unnecessary_containers: ignore
    prefer_conditional_assignment: ignore
    prefer_collection_literals: ignore
    constant_identifier_names: ignore
    annotate_overrides: ignore
    prefer_interpolation_to_compose_strings: ignore
    unnecessary_null_in_if_null_operators: ignore
    unintended_html_in_doc_comment: ignore
    unnecessary_library_name: ignore
    unnecessary_nullable_for_final_variable_declarations: ignore
    use_build_context_synchronously: ignore
    overridden_fields: ignore
    deprecated_member_use: ignore
    unnecessary_string_interpolations: ignore
    unnecessary_const: ignore
    avoid_print: ignore
    curly_braces_in_flow_control_structures: ignore
    avoid_single_cascade_in_expression_statements: ignore
    prefer_is_empty: ignore
    no_logic_in_create_state: ignore
    unnecessary_string_escapes: ignore
    prefer_spread_collections: ignore
    prefer_const_constructors: ignore
    prefer_const_declarations: ignore
    prefer_const_literals_to_create_immutables: ignore
    unnecessary_brace_in_string_interps: ignore
    avoid_redundant_argument_values: ignore
    unnecessary_parenthesis: ignore
    prefer_typing_uninitialized_variables: ignore
    prefer_generic_function_type_aliases: ignore
    avoid_init_to_null: ignore
    unnecessary_overrides: ignore
    unused_element: ignore
    dead_code: ignore

# 组件库移植自 Bruno,历史代码风格与严格 lint 存在差异,
# 以下规则关闭 info 级风格提示;error/warning 级别保持生效,CI 仍可用 --fatal-infos。
linter:
  rules:
    unnecessary_this: false
    prefer_initializing_formals: false
    use_super_parameters: false
    use_key_in_widget_constructors: false
    prefer_const_constructors_in_immutables: false
    library_private_types_in_public_api: false
    strict_top_level_inference: false
    no_leading_underscores_for_local_identifiers: false
    avoid_function_literals_in_foreach_calls: false
    sort_child_properties_last: false
    prefer_final_fields: false
    unnecessary_new: false
    sized_box_for_whitespace: false
    avoid_unnecessary_containers: false
    prefer_conditional_assignment: false
    prefer_collection_literals: false
    constant_identifier_names: false
    annotate_overrides: false
    prefer_interpolation_to_compose_strings: false
    unnecessary_null_in_if_null_operators: false
    unintended_html_in_doc_comment: false
    unnecessary_library_name: false
    unnecessary_nullable_for_final_variable_declarations: false
    use_build_context_synchronously: false

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
